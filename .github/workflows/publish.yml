name: "Tauri Cross-Platform Build & Publish"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
          - platform: 'ubuntu-22.04'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust targets
        if: matrix.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools

      - name: Install node dependencies
        run: npm install

      - name: Build Tauri App and Publish to GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'SecureVault v__VERSION__'
          releaseBody: |
            🔐 **SecureVault** — 纯本地零知识跨平台桌面密码管理器。Argon2id/PBKDF2 + AES-256-GCM 加密，数据 100% 本地存储不联网。

            ### 功能亮点
            - 浏览器密码一键导入（Chrome/Edge/Firefox/Safari/1Password/LastPass/Bitwarden）
            - 一键打包 Manifest V3 浏览器扩展（离线解密 + 域名匹配 + 自动填充）
            - 修改主密码 / 切换 KDF 加密算法
            - 安全审计、密码生成器、加密备份导出/导入

            > 详细更新日志见 [CHANGELOG.md](https://github.com/NovanJex/SecureVault/blob/main/CHANGELOG.md)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Ad-hoc codesign macOS app
        if: matrix.platform == 'macos-latest'
        run: |
          # Tauri v2: app bundle 位于 bundle/macos/，且 --target 时产物在 triple 子目录
          APP=""
          for p in "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/SecureVault.app" "src-tauri/target/release/bundle/macos/SecureVault.app"; do
            if [ -d "$p" ]; then APP="$p"; break; fi
          done
          if [ -n "$APP" ]; then
            codesign --force --deep --sign - "$APP"
            echo "✅ Ad-hoc signed $APP"
          else
            echo "⚠️  SecureVault.app not found, skipping codesign"
          fi

      - name: Rename & upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          BUNDLE="src-tauri/target/release/bundle"
          VERSION="${{ github.ref_name }}"
          VER="${VERSION#v}"

          # NSIS installer
          cp "$BUNDLE/nsis/SecureVault_${VER}_x64-setup.exe" "SecureVault_${VERSION}_Windows_x64-setup.exe"
          gh release upload "$VERSION" "SecureVault_${VERSION}_Windows_x64-setup.exe" --repo ${{ github.repository }} --clobber

          # MSI installer
          cp "$BUNDLE/msi/SecureVault_${VER}_x64_zh-CN.msi" "SecureVault_${VERSION}_Windows_x64_zh-CN.msi"
          gh release upload "$VERSION" "SecureVault_${VERSION}_Windows_x64_zh-CN.msi" --repo ${{ github.repository }} --clobber

          # Portable zip
          BIN="src-tauri/target/release/secure-vault-desktop.exe"
          STAGING="SecureVault"
          mkdir -p "$STAGING"
          cp "$BIN" "$STAGING/SecureVault_${VERSION}_Windows_Portable.exe"
          7z a "SecureVault_${VERSION}_Windows_Portable.zip" "$STAGING"
          gh release upload "$VERSION" "SecureVault_${VERSION}_Windows_Portable.zip" --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename & upload macOS artifact
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VER="${VERSION#v}"
          # --target 时产物在 target/<triple>/release/bundle，兼容两种目录
          DMG_DIR=""
          for d in "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg" "src-tauri/target/release/bundle/dmg"; do
            if [ -d "$d" ]; then DMG_DIR="$d"; break; fi
          done
          if [ -z "$DMG_DIR" ]; then
            echo "❌ dmg bundle not found, searching:"
            find src-tauri/target -name "*.dmg" 2>/dev/null | head -5
            exit 1
          fi
          DMG=$(find "$DMG_DIR" -maxdepth 1 -name "SecureVault_*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "❌ SecureVault dmg not found in $DMG_DIR:"
            ls -la "$DMG_DIR"
            exit 1
          fi
          cp "$DMG" "SecureVault_${VERSION}_macOS_aarch64.dmg"
          gh release upload "$VERSION" "SecureVault_${VERSION}_macOS_aarch64.dmg" --repo ${{ github.repository }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename & upload Linux artifact
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VER="${VERSION#v}"
          cp "src-tauri/target/release/bundle/appimage/SecureVault_${VER}_amd64.AppImage" "SecureVault_${VERSION}_Linux_amd64.AppImage"
          gh release upload "$VERSION" "SecureVault_${VERSION}_Linux_amd64.AppImage" --repo ${{ github.repository }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
