name: "Tauri Cross-Platform Build & Publish"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # universal-apple-darwin: 同时包含 Apple Silicon (M 系列) 与 Intel (x86_64)
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
          - platform: 'ubuntu-22.04'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust targets
        if: matrix.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal 构建需要两个架构的 target 同时安装
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools

      - name: Install node dependencies
        run: npm install

      - name: Build Tauri App and Publish to GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'SecureVault v__VERSION__'
          # 占位文案：全部平台构建完成后由 update-release-notes job 从 CHANGELOG 自动填充
          releaseBody: |
            > ⏳ 构建产物上传中，说明将在全部平台构建完成后自动填充。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Ad-hoc codesign macOS app
        if: matrix.platform == 'macos-latest'
        run: |
          # Tauri v2: app bundle 位于 bundle/macos/；--target 时产物在 triple 子目录
          # universal 构建 → universal-apple-darwin，单架构构建 → aarch64/x86_64-apple-darwin
          APP=""
          for p in \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos/SecureVault.app" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/SecureVault.app" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos/SecureVault.app" \
            "src-tauri/target/release/bundle/macos/SecureVault.app"; do
            if [ -d "$p" ]; then APP="$p"; break; fi
          done
          if [ -n "$APP" ]; then
            codesign --force --deep --sign - "$APP"
            echo "✅ Ad-hoc signed $APP"
            # 输出实际架构验证（universal 应同时含 arm64 与 x86_64）
            lipo -archs "$APP/Contents/MacOS/SecureVault" 2>/dev/null || true
          else
            echo "⚠️  SecureVault.app not found, skipping codesign"
          fi

      - name: Rename & upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          BUNDLE="src-tauri/target/release/bundle"
          VERSION="${{ github.ref_name }}"
          VER="${VERSION#v}"

          # NSIS installer
          cp "$BUNDLE/nsis/SecureVault_${VER}_x64-setup.exe" "SecureVault_${VERSION}_Windows_x64-setup.exe"
          gh release upload "$VERSION" "SecureVault_${VERSION}_Windows_x64-setup.exe" --repo ${{ github.repository }} --clobber

          # MSI installer
          cp "$BUNDLE/msi/SecureVault_${VER}_x64_zh-CN.msi" "SecureVault_${VERSION}_Windows_x64_zh-CN.msi"
          gh release upload "$VERSION" "SecureVault_${VERSION}_Windows_x64_zh-CN.msi" --repo ${{ github.repository }} --clobber

          # Portable zip
          BIN="src-tauri/target/release/secure-vault-desktop.exe"
          STAGING="SecureVault"
          mkdir -p "$STAGING"
          cp "$BIN" "$STAGING/SecureVault_${VERSION}_Windows_Portable.exe"
          7z a "SecureVault_${VERSION}_Windows_Portable.zip" "$STAGING"
          gh release upload "$VERSION" "SecureVault_${VERSION}_Windows_Portable.zip" --repo ${{ github.repository }}

          # 删除原始命名产物（保留重命名版）
          gh release delete-asset "$VERSION" "SecureVault_${VER}_x64-setup.exe" --repo ${{ github.repository }} --yes || echo "⚠️ 原始 exe 不存在或已删除"
          gh release delete-asset "$VERSION" "SecureVault_${VER}_x64_zh-CN.msi" --repo ${{ github.repository }} --yes || echo "⚠️ 原始 msi 不存在或已删除"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename & upload macOS artifact
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VER="${VERSION#v}"
          # --target 时产物在 target/<triple>/release/bundle
          # universal 构建 → universal-apple-darwin 目录
          DMG_DIR=""
          for d in \
            "src-tauri/target/universal-apple-darwin/release/bundle/dmg" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg" \
            "src-tauri/target/release/bundle/dmg"; do
            if [ -d "$d" ]; then DMG_DIR="$d"; break; fi
          done
          if [ -z "$DMG_DIR" ]; then
            echo "❌ dmg bundle not found, searching:"
            find src-tauri/target -name "*.dmg" 2>/dev/null | head -5
            exit 1
          fi
          DMG=$(find "$DMG_DIR" -maxdepth 1 -name "SecureVault_*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "❌ SecureVault dmg not found in $DMG_DIR:"
            ls -la "$DMG_DIR"
            exit 1
          fi
          echo "📦 使用 dmg: $DMG"
          cp "$DMG" "SecureVault_${VERSION}_macOS_universal.dmg"
          gh release upload "$VERSION" "SecureVault_${VERSION}_macOS_universal.dmg" --repo ${{ github.repository }} --clobber

          # 删除历史命名的 aarch64 产物（若存在，避免 Release 出现两个 macOS 包）
          gh release delete-asset "$VERSION" "SecureVault_${VERSION}_macOS_aarch64.dmg" --repo ${{ github.repository }} --yes || true

          # 删除原始命名 dmg（保留重命名版；app.tar.gz 无重命名版，保留）
          # universal 构建原始名为 _universal.dmg，历史单架构构建为 _aarch64.dmg
          gh release delete-asset "$VERSION" "SecureVault_${VER}_universal.dmg" --repo ${{ github.repository }} --yes || echo "⚠️ 原始 universal dmg 不存在或已删除"
          gh release delete-asset "$VERSION" "SecureVault_${VER}_aarch64.dmg" --repo ${{ github.repository }} --yes || echo "⚠️ 原始 aarch64 dmg 不存在或已删除"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix AppImage permissions, repackage & upload (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VER="${VERSION#v}"
          SRC="src-tauri/target/release/bundle/appimage/SecureVault_${VER}_amd64.AppImage"

          # ── 1. 解包原始 AppImage ──────────────────────────────────────────
          # --appimage-extract 由 runtime 内置实现，无需 FUSE
          chmod +x "$SRC"
          "$SRC" --appimage-extract >/dev/null
          echo "📦 已解包，检查 AppRun 系列文件原始权限："
          ls -l squashfs-root/AppRun* 2>/dev/null || echo "（无 AppRun 文件）"

          # ── 2. 修复权限（全量规范化，不能只修 AppRun 两个文件！）────────
          # 实测根因（解析 squashfs inode 确认）：
          #   - 根目录权限为 0700（other 无 r-x）
          #   - AppRun.wrapped 为 0770（other 无执行位）
          # Firejail 沙箱以非 owner 身份访问时，路径中任何目录缺 other 权限
          # 都会导致 "Permission denied"（即使目标文件本身是 755）
          find squashfs-root -type d -exec chmod 755 {} \;
          find squashfs-root -type f -perm /111 -exec chmod 755 {} \;
          find squashfs-root -type f ! -perm /111 -exec chmod 644 {} \;
          echo "📋 权限规范化后关键项："
          stat -c '%a  %n' squashfs-root
          stat -c '%a  %n' squashfs-root/AppRun
          [ -f squashfs-root/AppRun.wrapped ] && stat -c '%a  %n' squashfs-root/AppRun.wrapped || true

          # ── 3. 手动打包 ★关键★ ──────────────────────────────────────────
          # 不用 appimagetool：它内部把 AppDir 复制到 mktemp 创建的 0700 临时目录
          # 后再打包，导致产物根目录恒为 0700 —— Firejail 以非 owner 身份无法
          # 遍历根目录，报 "AppRun: Permission denied"。
          # （实证：解析 squashfs inode 对比 —— 原包根目录 0755 / appimagetool
          #   重打包 0700）
          # 手动 mksquashfs 直接读取文件系统权限（chmod 后的 755），无复制环节。

          # 3a. 从原始包提取 runtime（复用原装 runtime，保证与上游一致）
          OFFSET=$(python3 -c "
          data = open('$SRC', 'rb').read()
          pos = 0
          while True:
              pos = data.find(b'hsqs', pos)
              if pos < 0: raise SystemExit('squashfs magic not found')
              bs = int.from_bytes(data[pos+12:pos+16], 'little')
              ic = int.from_bytes(data[pos+4:pos+8], 'little')
              if 4096 <= bs <= 1048576 and (bs & (bs - 1)) == 0 and 0 < ic < 10000000:
                  print(pos); break
              pos += 4
          ")
          head -c "$OFFSET" "$SRC" > runtime.bin
          echo "📦 提取 runtime: $OFFSET bytes（原包 squashfs 偏移）"

          # 3b. 手动打包 squashfs（参数与原始包一致：zstd / 128KB 块 / root 属主）
          mksquashfs squashfs-root squashfs.img -all-root -noappend -comp zstd -b 131072 -no-progress

          # 3c. 拼接：AppImage = runtime + squashfs
          OUT="SecureVault-${VER}-x86_64.AppImage"
          cat runtime.bin squashfs.img > "$OUT"
          chmod +x "$OUT"
          rm -f runtime.bin squashfs.img
          echo "✅ 手动打包完成: $OUT ($(stat -c '%s' "$OUT") bytes)"

          # ── 4. 自检：重新解包验证权限（失败则中止构建，防止发布坏产物）──
          rm -rf squashfs-root
          chmod +x "$OUT"
          "./$OUT" --appimage-extract >/dev/null   # 注意 ./ 前缀：纯文件名不走 PATH 查找
          echo "🔍 重打包产物权限自检："

          # ① 根目录必须 755（0700 是 Firejail 报 "Permission denied" 的真因）
          root_perm=$(stat -c '%a' squashfs-root)
          echo "  根目录权限: $root_perm"
          if [ "$root_perm" != "755" ]; then
            echo "❌ 自检失败：根目录权限 $root_perm ≠ 755（沙箱下无法遍历）"
            exit 1
          fi

          # ② 所有目录 other 位必须含 r-x
          bad_dirs=$(find squashfs-root -type d ! -perm -0005 | head -5)
          if [ -n "$bad_dirs" ]; then
            echo "❌ 自检失败：以下目录 other 权限不足："
            echo "$bad_dirs"
            exit 1
          fi
          echo "  ✓ 全部目录 other 可读可进入"

          # ③ AppRun 系列 other 必须可执行
          ls -l squashfs-root/AppRun* 2>/dev/null || true
          for f in squashfs-root/AppRun squashfs-root/AppRun.wrapped; do
            [ -e "$f" ] || continue
            perm=$(stat -c '%a' "$f")
            other=$(( 10#$perm % 10 ))
            if [ $(( other & 1 )) -eq 0 ]; then
              echo "❌ 自检失败：$f 权限 $perm（other 无执行位）"
              exit 1
            fi
            echo "  ✓ $f 权限 $perm"
          done
          echo "✅ 权限自检通过（目录 755 + AppRun 系列 other 可执行）"

          # ── 5. 上传到 Release ────────────────────────────────────────────
          gh release upload "$VERSION" "$OUT" --repo ${{ github.repository }} --clobber

          # 清理旧命名的 AppImage 资产（含前版本的命名与原始名）
          gh release delete-asset "$VERSION" "SecureVault_${VERSION}_Linux_amd64.AppImage" --repo ${{ github.repository }} --yes || true
          gh release delete-asset "$VERSION" "SecureVault_${VER}_amd64.AppImage" --repo ${{ github.repository }} --yes || echo "⚠️ 原始命名 AppImage 不存在或已删除"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 全部平台构建完成后，从 CHANGELOG.md 提取当前版本段落自动填充 Release 说明
  # （避免每次都手动复制粘贴版本说明）
  update-release-notes:
    needs: publish-tauri
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract version section from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME}"   # 如 v1.5.2
          VER="${VERSION#v}"             # 如 1.5.2
          # 提取 "## vX.X.X (...)" 标题行开始、到下一个 "---" 之前的段落
          # 用字段比较（$2 == "v1.5.2"）而非正则，避免括号转义兼容问题
          awk -v ver="$VER" '
            $1 == "##" && $2 == "v" ver {found=1; next}
            found && $0 == "---" {exit}
            found {print}
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "⚠️ CHANGELOG 中未找到 v${VER} 段落，保留草稿原有说明"
            rm -f notes.md
            exit 0
          fi

          # 追加平台安装提示（固定内容，不写进 CHANGELOG）
          cat >> notes.md <<'EOF'

          > 🍎 macOS 提示：如打开时提示"已损坏"，终端执行 `xattr -cr /Applications/SecureVault.app` 后重新打开即可
          >
          > 🐧 Linux 提示：老系统 (Ubuntu 20.04-) 需 `sudo apt install libwebkit2gtk-4.1-dev libgtk-3-dev`；新系统缺少 libfuse2 用 `./SecureVault_amd64.AppImage --appimage-extract-and-run`
          EOF

          echo "--- 生成的 Release 说明 ---"
          cat notes.md

      - name: Update release draft notes
        if: hashFiles('notes.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --notes-file notes.md --repo ${{ github.repository }}
          echo "✅ Release 草稿说明已更新"
