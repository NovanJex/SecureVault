name: "Tauri Cross-Platform Build & Publish"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
          - platform: 'ubuntu-22.04'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust targets
        if: matrix.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools

      - name: Install node dependencies
        run: npm install

      - name: Build Tauri App and Publish to GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'SecureVault v__VERSION__'
          releaseBody: |
            🔐 **SecureVault** — 纯本地零知识跨平台桌面密码管理器。Argon2id/PBKDF2 + AES-256-GCM 加密，数据 100% 本地存储不联网。

            ### 功能亮点
            - 浏览器密码一键导入（Chrome/Edge/Firefox/Safari/1Password/LastPass/Bitwarden）
            - 一键打包 Manifest V3 浏览器扩展（离线解密 + 域名匹配 + 自动填充）
            - 修改主密码 / 切换 KDF 加密算法
            - 安全审计、密码生成器、加密备份导出/导入

            > 详细更新日志见 [CHANGELOG.md](https://github.com/NovanJex/SecureVault/blob/main/CHANGELOG.md)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Ad-hoc codesign macOS app
        if: matrix.platform == 'macos-latest'
        run: |
          APP="src-tauri/target/release/bundle/dmg/SecureVault.app"
          if [ -d "$APP" ]; then
            codesign --force --deep --sign - "$APP"
            echo "✅ Ad-hoc signed $APP"
          else
            echo "⚠️  $APP not found, skipping codesign"
          fi

      - name: Upload Windows portable binary
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          BIN="src-tauri/target/release/secure-vault-desktop.exe"
          VERSION="${{ github.ref_name }}"        # v1.0.0
          VER="${VERSION#v}"                      # 1.0.0（去掉 v 前缀，与 Tauri 产物命名一致）

          # 构建干净的目录结构: SecureVault/SecureVault_1.0.0_Windows.exe
          STAGING="SecureVault"
          mkdir -p "$STAGING"
          cp "$BIN" "$STAGING/SecureVault_${VER}_Windows.exe"

          ZIP="SecureVault_${VER}_Windows.zip"
          7z a "$ZIP" "$STAGING"

          gh release upload "${{ github.ref_name }}" "$ZIP" --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
