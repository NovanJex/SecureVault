name: "Tauri Cross-Platform Build & Publish"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # universal-apple-darwin: 同时包含 Apple Silicon (M 系列) 与 Intel (x86_64)
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
          - platform: 'ubuntu-22.04'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust targets
        if: matrix.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal 构建需要两个架构的 target 同时安装
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools \
            zsync

      - name: Install node dependencies
        run: npm install

      - name: Build Tauri App and Publish to GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 签名私钥（无密码）；生成 *.sig，供 latest.json 与前端校验
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 必须显式置空：密钥无密码时，缺失该变量会触发交互式密码提示（CI 下挂起/失败）
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: 'SecureVault v__VERSION__'
          # 占位文案：全部平台构建完成后由 update-release-notes job 从 CHANGELOG 自动填充
          releaseBody: |
            > ⏳ 构建产物上传中，说明将在全部平台构建完成后自动填充。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify macOS app signing & arch
        if: matrix.platform == 'macos-latest'
        run: |
          # 背景：DMG 由 tauri-action 阶段完成打包，其内 app 由 Tauri 打包器自动
          # ad-hoc 签名（旧版此处 codesign --force 输出 "replacing existing
          # signature" 即证明已有签名；且该步骤在 DMG 打包之后执行，只作用于
          # target 目录、无法影响已生成的 DMG）→ 改为校验，防止未来 Tauri 打包
          # 行为变化导致“未签名产物被静默发布”回归。
          APP=""
          for p in \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos/SecureVault.app" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/SecureVault.app" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos/SecureVault.app" \
            "src-tauri/target/release/bundle/macos/SecureVault.app"; do
            if [ -d "$p" ]; then APP="$p"; break; fi
          done
          if [ -z "$APP" ]; then
            echo "❌ SecureVault.app not found, cannot verify signing"
            exit 1
          fi
          echo "📦 校验签名: $APP"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier|Format" || true
          if codesign --verify --deep "$APP"; then
            echo "✅ ad-hoc 签名有效（DMG 内为同一签名产物）"
          else
            echo "⚠️ 签名校验异常——请检查 Tauri 打包器签名行为是否变化"
          fi
          # 输出实际架构验证（universal 应同时含 arm64 与 x86_64）
          lipo -archs "$APP/Contents/MacOS/SecureVault" 2>/dev/null || true

      - name: Rename & upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          BUNDLE="src-tauri/target/release/bundle"
          VERSION="${{ github.ref_name }}"
          VER="${VERSION#v}"

          # NSIS installer
          cp "$BUNDLE/nsis/SecureVault_${VER}_x64-setup.exe" "SecureVault_${VERSION}_Windows_x64-setup.exe"
          gh release upload "$VERSION" "SecureVault_${VERSION}_Windows_x64-setup.exe" --repo ${{ github.repository }} --clobber

          # MSI installer
          cp "$BUNDLE/msi/SecureVault_${VER}_x64_zh-CN.msi" "SecureVault_${VERSION}_Windows_x64_zh-CN.msi"
          gh release upload "$VERSION" "SecureVault_${VERSION}_Windows_x64_zh-CN.msi" --repo ${{ github.repository }} --clobber

          # Portable zip
          BIN="src-tauri/target/release/secure-vault-desktop.exe"
          STAGING="SecureVault"
          mkdir -p "$STAGING"
          cp "$BIN" "$STAGING/SecureVault_${VERSION}_Windows_Portable.exe"
          7z a "SecureVault_${VERSION}_Windows_Portable.zip" "$STAGING"
          gh release upload "$VERSION" "SecureVault_${VERSION}_Windows_Portable.zip" --repo ${{ github.repository }}

          # updater 签名文件：latest.json 内嵌其内容（重命名安装包不影响签名有效性，
          # 因为签名针对文件内容）。缺失即失败 —— 防止静默发布无法应用内更新的版本。
          NSIS_SIG="$BUNDLE/nsis/SecureVault_${VER}_x64-setup.exe.sig"
          if [ -f "$NSIS_SIG" ]; then
            gh release upload "$VERSION" "$NSIS_SIG" --repo ${{ github.repository }} --clobber
            echo "✅ 已上传 updater 签名 $(basename "$NSIS_SIG")"
          else
            echo "❌ 未生成 NSIS updater 签名（检查 TAURI_SIGNING_PRIVATE_KEY 是否生效）"
            exit 1
          fi

          # 删除原始命名产物（保留重命名版）
          gh release delete-asset "$VERSION" "SecureVault_${VER}_x64-setup.exe" --repo ${{ github.repository }} --yes || echo "⚠️ 原始 exe 不存在或已删除"
          gh release delete-asset "$VERSION" "SecureVault_${VER}_x64_zh-CN.msi" --repo ${{ github.repository }} --yes || echo "⚠️ 原始 msi 不存在或已删除"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename & upload macOS artifact
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VER="${VERSION#v}"
          # --target 时产物在 target/<triple>/release/bundle
          # universal 构建 → universal-apple-darwin 目录
          DMG_DIR=""
          for d in \
            "src-tauri/target/universal-apple-darwin/release/bundle/dmg" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg" \
            "src-tauri/target/release/bundle/dmg"; do
            if [ -d "$d" ]; then DMG_DIR="$d"; break; fi
          done
          if [ -z "$DMG_DIR" ]; then
            echo "❌ dmg bundle not found, searching:"
            find src-tauri/target -name "*.dmg" 2>/dev/null | head -5
            exit 1
          fi
          DMG=$(find "$DMG_DIR" -maxdepth 1 -name "SecureVault_*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "❌ SecureVault dmg not found in $DMG_DIR:"
            ls -la "$DMG_DIR"
            exit 1
          fi
          echo "📦 使用 dmg: $DMG"
          cp "$DMG" "SecureVault_${VERSION}_macOS_universal.dmg"
          gh release upload "$VERSION" "SecureVault_${VERSION}_macOS_universal.dmg" --repo ${{ github.repository }} --clobber

          # updater 产物兜底上传（universal .app.tar.gz + 签名，供 macOS 应用内更新）
          APP_DIR="$(dirname "$DMG_DIR")/macos"
          found_updater=0
          for f in "$APP_DIR"/SecureVault*.app.tar.gz "$APP_DIR"/SecureVault*.app.tar.gz.sig; do
            if [ -f "$f" ]; then
              gh release upload "$VERSION" "$f" --repo ${{ github.repository }} --clobber
              found_updater=1
            fi
          done
          if [ "$found_updater" -eq 1 ]; then
            echo "✅ updater 产物已确认上传 (macOS)"
          else
            echo "⚠️ 没有找到 .app.tar.gz（macOS 应用内更新将不可用）"
          fi

          # 删除历史命名的 aarch64 产物（若存在，避免 Release 出现两个 macOS 包）
          gh release delete-asset "$VERSION" "SecureVault_${VERSION}_macOS_aarch64.dmg" --repo ${{ github.repository }} --yes || true

          # 删除原始命名 dmg（保留重命名版；app.tar.gz 无重命名版，保留）
          # universal 构建原始名为 _universal.dmg，历史单架构构建为 _aarch64.dmg
          gh release delete-asset "$VERSION" "SecureVault_${VER}_universal.dmg" --repo ${{ github.repository }} --yes || echo "⚠️ 原始 universal dmg 不存在或已删除"
          gh release delete-asset "$VERSION" "SecureVault_${VER}_aarch64.dmg" --repo ${{ github.repository }} --yes || echo "⚠️ 原始 aarch64 dmg 不存在或已删除"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix AppImage permissions, repackage & upload (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VER="${VERSION#v}"
          SRC="src-tauri/target/release/bundle/appimage/SecureVault_${VER}_amd64.AppImage"

          # ── 1. 解包原始 AppImage ──────────────────────────────────────────
          # --appimage-extract 由 runtime 内置实现，无需 FUSE
          chmod +x "$SRC"
          "$SRC" --appimage-extract >/dev/null
          echo "📦 已解包，检查 AppRun 系列文件原始权限："
          ls -l squashfs-root/AppRun* 2>/dev/null || echo "（无 AppRun 文件）"

          # ── 2. 修复权限（全量规范化，不能只修 AppRun 两个文件！）────────
          # 实测根因（解析 squashfs inode 确认）：
          #   - 根目录权限为 0700（other 无 r-x）
          #   - AppRun.wrapped 为 0770（other 无执行位）
          # Firejail 沙箱以非 owner 身份访问时，路径中任何目录缺 other 权限
          # 都会导致 "Permission denied"（即使目标文件本身是 755）
          find squashfs-root -type d -exec chmod 755 {} \;
          find squashfs-root -type f -perm /111 -exec chmod 755 {} \;
          find squashfs-root -type f ! -perm /111 -exec chmod 644 {} \;
          echo "📋 权限规范化后关键项："
          stat -c '%a  %n' squashfs-root
          stat -c '%a  %n' squashfs-root/AppRun
          [ -f squashfs-root/AppRun.wrapped ] && stat -c '%a  %n' squashfs-root/AppRun.wrapped || true

          # ── 3. 手动打包 ★关键★ ──────────────────────────────────────────
          # 不用 appimagetool：它内部把 AppDir 复制到 mktemp 创建的 0700 临时目录
          # 后再打包，导致产物根目录恒为 0700 —— Firejail 以非 owner 身份无法
          # 遍历根目录，报 "AppRun: Permission denied"。
          # （实证：解析 squashfs inode 对比 —— 原包根目录 0755 / appimagetool
          #   重打包 0700）
          # 手动 mksquashfs 直接读取文件系统权限（chmod 后的 755），无复制环节。

          # 3a. 生成带更新信息的 runtime（.upd_info，供 AppImageUpdate 使用）
          # 说明：直接对 runtime 用 `objcopy --add-section` 在 CI 上实测失败
          # （"file format not recognized"），改用官方 appimagetool 生成 upd_info
          # 后的 runtime。squashfs 仍由下方手动 mksquashfs 打包，以保留规范化后
          # 的 755 根目录（appimagetool 的临时复制会引入 0700 根目录问题）。
          UPD_INFO="gh-releases-zsync|NovanJex|SecureVault|latest|SecureVault-*-x86_64.AppImage.zsync"
          wget -q -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          # APPIMAGE_EXTRACT_AND_RUN=1 让 appimagetool 在无 FUSE 的 CI 环境运行
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool -u "$UPD_INFO" squashfs-root tmp_pack.AppImage >/dev/null 2>&1 \
            || { echo "❌ appimagetool 生成临时包失败（用于提取带 .upd_info 的 runtime）"; exit 1; }

          # 从临时产物中提取 runtime（magic 扫描定位 squashfs 起点 = runtime 长度）
          RT_SIZE=$(python3 -c "
          data = open('tmp_pack.AppImage', 'rb').read()
          pos = 0
          while True:
              pos = data.find(b'hsqs', pos)
              if pos < 0: raise SystemExit('squashfs magic not found')
              bs = int.from_bytes(data[pos+12:pos+16], 'little')
              ic = int.from_bytes(data[pos+4:pos+8], 'little')
              if 4096 <= bs <= 1048576 and (bs & (bs - 1)) == 0 and 0 < ic < 10000000:
                  print(pos); break
              pos += 4
          ")
          head -c "$RT_SIZE" tmp_pack.AppImage > runtime_patched.bin
          rm -f tmp_pack.AppImage appimagetool
          echo "📦 runtime(含 .upd_info): $RT_SIZE bytes"
          if ! readelf -S runtime_patched.bin | grep -q "upd_info"; then
            echo "❌ 自检失败：runtime 缺少 .upd_info（appimagetool 版本行为可能变化）"
            exit 1
          fi
          echo "  ✓ runtime 已含 .upd_info"

          # 3b. 手动打包 squashfs（参数与原始包一致：zstd / 128KB 块 / root 属主）
          mksquashfs squashfs-root squashfs.img -all-root -noappend -comp zstd -b 131072 -no-progress

          # ── 3c. 自检：挂载 squashfs 读内核视角的权限记录 ─────────────────
          # ★不可用 "$OUT" --appimage-extract 后 stat squashfs-root★：
          # 该顶层目录由 runtime 自行 mkdir 创建（0700，与包内记录无关），
          # 用它判定根目录恒得 700 —— 假阴性，会误拦正常产物。
          # （v1.5.4 第 3 轮实测：mksquashfs 从 755 的源打包、无复制环节，
          #   解包后根目录仍显示 700，证明该读数不反映包内容。）
          # mount 读到的 root inode 权限才是 Firejail 沙箱读取的同一来源。
          sudo mkdir -p /mnt/svcheck
          sudo mount -o loop,ro squashfs.img /mnt/svcheck
          trap 'sudo umount /mnt/svcheck 2>/dev/null || true' EXIT

          # ① 根目录必须 755（0700 是 Firejail 报 "Permission denied" 的真因）
          root_perm=$(stat -c '%a' /mnt/svcheck)
          echo "🔍 包内根目录权限: $root_perm"
          if [ "$root_perm" != "755" ]; then
            echo "❌ 自检失败：根目录权限 $root_perm ≠ 755（沙箱下无法遍历）"
            exit 1
          fi

          # ② 所有目录 other 位必须含 r-x
          bad_dirs=$(find /mnt/svcheck -type d ! -perm -0005 | head -5)
          if [ -n "$bad_dirs" ]; then
            echo "❌ 自检失败：以下目录 other 权限不足："
            echo "$bad_dirs"
            exit 1
          fi
          echo "  ✓ 全部目录 other 可读可进入"

          # ③ AppRun 系列 other 必须可执行
          for f in /mnt/svcheck/AppRun /mnt/svcheck/AppRun.wrapped; do
            [ -e "$f" ] || continue
            perm=$(stat -c '%a' "$f")
            other=$(( 10#$perm % 10 ))
            if [ $(( other & 1 )) -eq 0 ]; then
              echo "❌ 自检失败：$(basename "$f") 权限 $perm（other 无执行位）"
              exit 1
            fi
            echo "  ✓ $(basename "$f") 权限 $perm"
          done
          sudo umount /mnt/svcheck || true
          echo "✅ 权限自检通过（目录 755 + AppRun 系列 other 可执行）"

          # ── 3d. 拼接：AppImage = runtime + squashfs ──────────────────────
          OUT="SecureVault-${VER}-x86_64.AppImage"
          cat runtime_patched.bin squashfs.img > "$OUT"
          chmod +x "$OUT"

          # 拼接完整性校验：产物尾部应与 squashfs.img 逐字节一致
          # 注意：runtime 已被 objcopy 改写（.upd_info），偏移必须用 patched 后的大小
          tail -c +$((RT_SIZE + 1)) "$OUT" > spliced.img
          if ! cmp -s spliced.img squashfs.img; then
            echo "❌ 拼接校验失败：产物尾部与 squashfs.img 不一致"
            exit 1
          fi
          rm -f spliced.img runtime_patched.bin squashfs.img

          # 3d-2. 校验 .upd_info 已嵌入且 runtime 仍可执行（防 objcopy 损坏 runtime）
          if ! readelf -S "$OUT" | grep -q "upd_info"; then
            echo "❌ 自检失败：产物缺少 .upd_info（AppImageUpdate 将不可用）"
            exit 1
          fi
          echo "  ✓ .upd_info 已嵌入"
          if ! "./$OUT" --appimage-version >/dev/null 2>&1; then
            echo "❌ 自检失败：runtime 无法执行（objcopy 可能损坏了 runtime）"
            exit 1
          fi
          echo "  ✓ runtime 可执行（--appimage-version 通过）"

          echo "✅ 手动打包完成: $OUT ($(stat -c '%s' "$OUT") bytes)"

          # ── 4. 上传到 Release ────────────────────────────────────────────
          gh release upload "$VERSION" "$OUT" --repo ${{ github.repository }} --clobber

          # 4b. 生成并上传 .zsync（AppImageUpdate 增量更新元数据）
          ZSYNC="SecureVault-${VER}-x86_64.AppImage.zsync"
          zsyncmake -u "https://github.com/${{ github.repository }}/releases/download/${VERSION}/${ZSYNC}" -o "$ZSYNC" "$OUT"
          gh release upload "$VERSION" "$ZSYNC" --repo ${{ github.repository }} --clobber
          echo "✅ 已上传 $ZSYNC"

          # 清理 Tauri 生成的 updater 冗余产物（Linux 更新走 AppImageUpdate，
          # 且手动重打包的 AppImage 与 tauri 的 tar.gz 内容不一致，保留会误导）
          gh release delete-asset "$VERSION" "SecureVault_${VER}_amd64.AppImage.tar.gz" --repo ${{ github.repository }} --yes || true
          gh release delete-asset "$VERSION" "SecureVault_${VER}_amd64.AppImage.tar.gz.sig" --repo ${{ github.repository }} --yes || true

          # 清理旧命名的 AppImage 资产（含前版本的命名与原始名）
          gh release delete-asset "$VERSION" "SecureVault_${VERSION}_Linux_amd64.AppImage" --repo ${{ github.repository }} --yes || true
          gh release delete-asset "$VERSION" "SecureVault_${VER}_amd64.AppImage" --repo ${{ github.repository }} --yes || echo "⚠️ 原始命名 AppImage 不存在或已删除"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 全部平台构建完成后，从 CHANGELOG.md 提取当前版本段落自动填充 Release 说明
  # （避免每次都手动复制粘贴版本说明）
  update-release-notes:
    needs: publish-tauri
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract version section from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME}"   # 如 v1.5.2
          VER="${VERSION#v}"             # 如 1.5.2
          # 提取 "## vX.X.X (...)" 标题行开始、到下一个 "---" 之前的段落
          # 用字段比较（$2 == "v1.5.2"）而非正则，避免括号转义兼容问题
          extract_section() {
            awk -v ver="$VER" '
              $1 == "##" && $2 == "v" ver {found=1; next}
              found && $0 == "---" {exit}
              found {print}
            ' "$1"
          }

          extract_section CHANGELOG.md > notes_zh.md

          if [ ! -s notes_zh.md ]; then
            echo "⚠️ CHANGELOG 中未找到 v${VER} 段落，保留草稿原有说明"
            rm -f notes_zh.md
            exit 0
          fi

          # 英文段（CHANGELOG_EN.md 自 v1.7.0 起提供；历史版本仅有中文段）
          : > notes_en.md
          if [ -f CHANGELOG_EN.md ]; then
            extract_section CHANGELOG_EN.md > notes_en.md || true
          fi

          cp notes_zh.md notes.md
          if [ -s notes_en.md ]; then
            printf '\n---\n\n' >> notes.md
            cat notes_en.md >> notes.md
          else
            echo "ℹ️ CHANGELOG_EN.md 中无 v${VER} 英文段，Release 说明仅含中文"
          fi

          # 追加平台安装提示（固定内容，不写进 CHANGELOG；中英双语）
          cat >> notes.md <<'EOF'

          > 🍎 macOS 提示：请先将 SecureVault.app 拖入「应用程序」文件夹再启动（直接从 DMG 挂载盘运行会导致每次启动都弹出安全授权）。如提示"无法验证开发者"，在「系统设置 → 隐私与安全性」点「仍要打开」，或终端执行 `xattr -cr /Applications/SecureVault.app` 后重新打开
          >
          > 🐧 Linux 提示：老系统 (Ubuntu 20.04-) 需 `sudo apt install libwebkit2gtk-4.1-dev libgtk-3-dev`；新系统缺少 libfuse2 用 `./SecureVault-X.X.X-x86_64.AppImage --appimage-extract-and-run`
          >
          > ---
          >
          > 🍎 **macOS**: Drag SecureVault.app into the Applications folder before launching (running it directly from the mounted DMG triggers a security prompt on every launch). If macOS reports "cannot verify the developer", choose "Open Anyway" under System Settings → Privacy & Security, or run `xattr -cr /Applications/SecureVault.app` and reopen.
          >
          > 🐧 **Linux**: On older systems (Ubuntu 20.04-) install `libwebkit2gtk-4.1-dev libgtk-3-dev`; if libfuse2 is missing, run `./SecureVault-X.X.X-x86_64.AppImage --appimage-extract-and-run`
          EOF

          echo "--- 生成的 Release 说明 ---"
          cat notes.md

      - name: Update release draft notes
        if: hashFiles('notes.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --notes-file notes.md --repo ${{ github.repository }}
          echo "✅ Release 草稿说明已更新"

      # 生成应用内更新清单 latest.json（Tauri updater 端点）：
      #   https://github.com/<repo>/releases/latest/download/latest.json
      # 全部平台构建结束后统一生成，避免并行上传互相覆盖。
      # Linux 不纳入（AppImageUpdate 走 .zsync）；macOS universal 包同时服务两个平台 key。
      - name: Generate & upload latest.json (in-app updater manifest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          VER="${VERSION#v}"
          REPO="${{ github.repository }}"
          mkdir -p sigs
          gh release download "$VERSION" --repo "$REPO" --pattern "*.sig" --dir sigs --clobber
          echo "已下载签名文件："
          ls -l sigs || true

          python3 - "$VER" "$VERSION" "$REPO" <<'PYEOF'
          import json, os, sys, datetime, urllib.parse
          ver, tag, repo = sys.argv[1], sys.argv[2], sys.argv[3]
          sigdir = 'sigs'

          def sig_content(name):
              path = os.path.join(sigdir, name + '.sig')
              if not os.path.exists(path):
                  raise SystemExit('missing signature file: ' + path)
              return open(path, encoding='utf-8').read().strip()

          base = 'https://github.com/' + repo + '/releases/download/' + tag + '/'
          assets = sorted(os.listdir(sigdir))
          win_sig = next((a for a in assets if a.endswith('-setup.exe.sig')), None)
          mac_sig = next((a for a in assets if a.endswith('.app.tar.gz.sig')), None)
          if not win_sig or not mac_sig:
              raise SystemExit('签名文件缺失: win=' + str(win_sig) + ' mac=' + str(mac_sig) + ' 实际=' + str(assets))

          # Windows：使用重命名后的安装包资产（内容与 .sig 对应）
          win_exe = 'SecureVault_' + tag + '_Windows_x64-setup.exe'
          # macOS：universal .app.tar.gz 原样保留
          mac_tar = mac_sig[:-4]
          mac_url = base + urllib.parse.quote(mac_tar)

          notes = ''
          if os.path.exists('notes.md'):
              notes = open('notes.md', encoding='utf-8').read()

          manifest = {
              'version': ver,
              'notes': notes,
              'pub_date': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
              'platforms': {
                  'windows-x86_64': {'signature': sig_content(win_sig[:-4]), 'url': base + win_exe},
                  'darwin-aarch64': {'signature': sig_content(mac_tar), 'url': mac_url},
                  'darwin-x86_64': {'signature': sig_content(mac_tar), 'url': mac_url},
              },
          }
          with open('latest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          print(json.dumps(manifest, ensure_ascii=False, indent=2)[:800])
          PYEOF

          gh release upload "$VERSION" latest.json --repo "$REPO" --clobber
          echo "✅ latest.json 已上传（应用内更新清单）"

      # 清理冗余资产（必须在 latest.json 生成之后：需要先下载 *.sig 读取签名内容）
      # 保留：各平台安装包 + latest.json 引用的签名（SecureVault.app.tar.gz.sig / *-setup.exe.sig）
      # 说明：v1.7.0 实测 tauri-action 会额外上传 SecureVault_universal.app.tar.gz（与兜底上传的
      #       SecureVault.app.tar.gz 内容相同）；Linux 不使用 Tauri updater（AppImageUpdate 走 .zsync）；
      #       MSI 不用于自动更新（updater 走 NSIS）——这些签名文件均属冗余。
      - name: Prune redundant assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          VER="${VERSION#v}"
          REPO="${{ github.repository }}"
          echo "🧹 开始清理冗余资产..."
          for name in \
            "SecureVault_universal.app.tar.gz" \
            "SecureVault_universal.app.tar.gz.sig" \
            "SecureVault_${VER}_amd64.AppImage.sig" \
            "SecureVault_${VER}_amd64.deb.sig" \
            "SecureVault-${VER}-1.x86_64.rpm.sig" \
            "SecureVault_${VER}_x64_zh-CN.msi.sig"; do
            if gh release delete-asset "$VERSION" "$name" --repo "$REPO" --yes 2>/dev/null; then
              echo "  🗑️ 已删除: $name"
            else
              echo "  ⏭️ 不存在（跳过）: $name"
            fi
          done
          echo "✅ 资产清理完成"
